name: attach-installer

# 手动触发：把某次 Windows 构建 run 的安装包产物挂到指定 Release 上。
# 解决浏览器/API 都无法上传 Release 附件的问题（GITHUB_TOKEN 在 CI 内可以）。
# 用法：Actions 页 → attach-installer → Run workflow → 填 build_run_id 与 tag。
#
# 注意：不要用 `gh release upload` 传中文文件名——GitHub 会把 CJK 字符从
# multipart 文件名里剥掉（实测 "暮冬念春-Setup-2.0.2-win64.exe" 变成
# "-Setup-2.0.1-win64.exe"）。连 uploads API 的 ?name= 参数（已做
# percent-encoding）也会被服务端剥掉 CJK 字符。结论：GitHub Release 资产名
# 只支持 ASCII，这里统一用拼音命名。

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Windows 构建产物所在的 Actions run id'
        required: true
      tag:
        description: '目标 Release tag'
        required: true
        default: 'v1.2.0'

permissions:
  contents: write
  actions: read

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-installer
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to release (API, explicit ASCII name)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          FILE=$(ls *-Setup-*-win64.exe | head -n 1)
          if [ -z "$FILE" ]; then
            echo "::error::未在 artifact 中找到 *-Setup-*-win64.exe"
            exit 1
          fi
          VER="${TAG#v}"
          ASSET_NAME="novel-lab-Setup-${VER}-win64.exe"
          ls -la "$FILE"
          EXPECTED_SIZE=$(stat -c%s "$FILE")
          EXPECTED_SHA=$(sha256sum "$FILE" | awk '{print $1}')
          echo "Local file: $FILE ($EXPECTED_SIZE bytes, sha256:$EXPECTED_SHA)"
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" --jq .id)
          NAME=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$ASSET_NAME")
          echo "uploading $FILE as asset: $ASSET_NAME to release $RELEASE_ID"
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${FILE}" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=${NAME}" \
            | tee upload_result.json
          EXPECTED_ASSET="$ASSET_NAME" EXPECTED_SIZE="$EXPECTED_SIZE" EXPECTED_SHA="$EXPECTED_SHA" python3 - <<'EOF'
          import json, os
          d = json.load(open("upload_result.json"))
          want_name = os.environ["EXPECTED_ASSET"]
          want_size = int(os.environ["EXPECTED_SIZE"])
          want_digest = "sha256:" + os.environ["EXPECTED_SHA"]
          assert d.get("name") == want_name, f"name unexpected: {d.get('name')} != {want_name}"
          assert d.get("size") == want_size, f"size mismatch: {d.get('size')} != {want_size}"
          assert d.get("digest") == want_digest, f"digest mismatch: {d.get('digest')} != {want_digest}"
          print("OK:", d["name"], d["size"], "bytes", d["digest"])
          print("download:", d["browser_download_url"])
          EOF
