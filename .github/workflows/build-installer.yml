name: 构建 Windows 安装包

# 用途：Linux 构建机因缺 wine 打不出 NSIS 安装器（electron-builder 硬性要求），
# 真正的 .exe 安装器只能在 Windows 上构建。本 workflow 在云端 Windows runner
# 上跑 `npm run dist`，产物为 NSIS 安装器。
#
# 触发：手动 Run workflow，或推送 v* tag（发版时自动出安装包并挂 Release）。
#
# 关于产物去向（2026-10-29 改造）：
#   旧流程是「上传 artifact → 再手动跑 attach-installer 从 artifact 挂到 Release」，
#   两步且强依赖 Actions artifact 存储。实测该存储曾因历史 89MB 安装包堆积
#   触及账号配额（"Artifact storage quota has been hit"），整条发版链随之断开
#   ——包能构建出来却传不上去。
#   现改为：**构建完直接挂到 Release**（GitHub Releases 与 Actions artifact 是
#   两套独立配额），artifact 上传降级为可选（continue-on-error），配额满时只
#   告警不影响发版。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要挂载的 Release tag（留空则只构建不上传）'
        required: false
        default: ''
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
        # 注：启用 npm 缓存的前提是 desktop/package-lock.json 已入库（旧写法里它被
        # .gitignore 忽略，runner 上没有 lock，开缓存会 "unable to cache dependencies" 硬失败）。

      - name: 安装依赖
        # 用 npm ci 而不是 npm install：依赖版本由仓库里的 lockfile 决定，
        # 不再随每次 runner 解析漂移（旧写法每次可能装到不同的 Electron / electron-builder）。
        run: npm ci

      - name: 构建 NSIS 安装器
        # predist 钩子自动执行：fetch-python-win.py（准备 embeddable Python，
        # runner 上 python 命令可用）+ sync_backend.py（把后端与随包资源同步进
        # desktop/backend/，含 python-win/；缺失则 fail fast，不产残缺包）。
        # 文件数不写在这里：资产与报告增删（甚至新增一个 gui/*.py）都会让任何
        # 手抄的数字立刻过期，sync_backend.py 运行时会自己打印实际数量。
        run: npm run dist

      - name: 解析目标 tag
        id: target
        shell: pwsh
        working-directory: .
        run: |
          $tag = "${{ inputs.tag }}"
          if (-not $tag -and "${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "目标 Release tag: [$tag]"

      - name: 上传到 Release
        if: steps.target.outputs.tag != ''
        shell: pwsh
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          # GitHub Release 资产名只支持 ASCII：中文名会被服务端剥掉
          # （实测「暮冬念春-Setup-2.0.2-win64.exe」变成「-Setup-2.0.2-win64.exe」）。
          # 因此上传用 ASCII 主名，中文名放进 --label 供页面显示。
          $exe = Get-ChildItem release\*-Setup-*-win64.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "未找到安装包产物"; exit 1 }
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if (-not $ver) { $ver = $env:TAG.TrimStart('v') }
          $asciiName = "novel-lab-Setup-$ver-win64.exe"
          Copy-Item $exe.FullName "release\$asciiName"
          Write-Host "上传 $asciiName ($([math]::Round($exe.Length/1MB,1)) MB) → $env:TAG"
          gh release upload $env:TAG "release\$asciiName" --clobber
          Write-Host "SHA256:"
          Get-FileHash $exe.FullName -Algorithm SHA256 | Format-List

      - name: 上传安装器（artifact，可选）
        # 配额满时不再中断发版：以上「直挂 Release」为主路径，artifact 仅作 CI 内
        # 二次分发用（例如 attach-installer 或人工下载对比哈希）。
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: desktop/release/*-Setup-*-win64.exe
          if-no-files-found: error
